name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK File
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Job_Mastery_BD.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-mastery-bd-apk
          path: build/app/outputs/flutter-apk/Job_Mastery_BD.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Release"
          body: "Automated build release"
          files: build/app/outputs/flutter-apk/Job_Mastery_BD.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}